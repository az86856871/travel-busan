<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韓國實用小字卡</title>
<style>
:root{--bg:#f4f9fc;--card:#fff;--ink:#1f2d3a;--muted:#5d6f7e;--primary:#0b7fab;--primary-d:#075a7a;--accent:#ff7a59;--line:#dbe8f0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
.hero{background:linear-gradient(160deg,#0b7fab 0%,#12a6c9 55%,#7fd6e6 100%);color:#fff;padding:16px 20px 22px;text-align:center}
.hero .back{display:block;text-align:left;color:#fff;text-decoration:none;font-size:.9rem;opacity:.95}
.hero h1{margin:6px 0 4px;font-size:1.5rem}
.hero p{margin:0;font-size:.9rem;opacity:.95}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
main.wrap{margin:16px auto 30px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:0 6px 18px rgba(11,127,171,.12)}
.card summary{cursor:pointer;font-size:1.05rem;font-weight:700;color:var(--primary-d)}
.card[open] summary{margin-bottom:6px}
.card .ko{display:block;margin:6px 0;font-size:1.3rem;font-weight:700;line-height:1.5}
.card .zh{color:var(--muted);font-size:.93rem}
.card button{margin:2px 0 6px;padding:6px 14px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-size:.9rem;cursor:pointer}
footer{text-align:center;color:var(--muted);padding:10px 16px 50px;font-size:.9rem}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><a class="back" href="index.html">← 回首頁</a><h1>韓國實用小字卡</h1><p>直接把畫面給店員看，也可以按播放讓手機唸給對方聽</p></div></header>
<main class="wrap">
  <details class="card">
    <summary>🐮 不吃牛</summary>
    在韓國餐廳點餐或確認小菜、高湯時，可以直接把這句話給店員看：
    <span class="ko">저는 소고기를 못 먹어요.<br>이 음식에 소고기나 소고기 육수가 들어가나요?</span>
    <button type="button" data-t="저는 소고기를 못 먹어요. 이 음식에 소고기나 소고기 육수가 들어가나요?">🔊 播放</button>
    <div class="zh">我不吃牛肉。請問這道料理裡面有加牛肉或牛肉高湯嗎？</div>
  </details>
</main>
<footer>願你把釜山的海風、美食與好心情，都帶回家 🌊</footer>
<script>
document.querySelectorAll('button[data-t]').forEach(function(b){
  b.addEventListener('click',function(){
    var s=window.speechSynthesis;
    if(!s){alert('此瀏覽器不支援語音播放');return}
    s.cancel();
    var u=new SpeechSynthesisUtterance(b.dataset.t);
    u.lang='ko-KR';u.rate=.85;s.speak(u);
  });
});
</script>
</body>
</html>
